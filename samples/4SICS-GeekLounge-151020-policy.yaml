# 4SICS-GeekLounge-151020.pcap 용 통신 정책.
#
# 이 캡처에는 Modbus 대화가 없다(전량 S7comm·비산업 트래픽). S7 만 선언한다.
# 1차와 같은 편집 의도 — 관찰된 통신 중 **일부만** 선언한다. 폴러의 읽기만 선언하고
# 쓰기는 선언하지 않으며, 두 번째 호스트(10.10.10.30)도 선언하지 않는다.
# 전부 선언하면 위반이 0건이라 대사가 실제로 도는지 알 수 없다.
version: 1

peers:
  - id: hmi-poller
    address: 10.10.10.20
  - id: plc-s7
    address: 10.10.10.10

allowed:
  - from: hmi-poller
    to: plc-s7
    protocol: S7COMM
    access: [READ]
