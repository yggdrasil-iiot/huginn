# The 4SICS captures are not redistributed here (samples/.gitignore), so the seven
# capture-gated regression tests skip and the suite runs 235 of 242. Everything that can be
# proven without a licensed third-party capture is proven here.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Test
        run: mvn -B -ntp test
      - name: Package the shaded CLI
        run: mvn -B -ntp -DskipTests package
