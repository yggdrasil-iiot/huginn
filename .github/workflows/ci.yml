# The 4SICS captures are not redistributed here (samples/.gitignore), so the seven
# capture-gated tests and the three Zeek-on-4SICS tests skip. CI fetches the two ICSNPP
# traces and runs 303 of 313. Everything that can be proven without a licensed third-party
# capture is proven here.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      # The two ICSNPP traces are fetched from pinned commits and hash-checked, so the
      # pcap-versus-Zeek-log cross-check runs on every build instead of only on a laptop.
      - name: Fetch ICSNPP traces
        run: bash scripts/fetch-icsnpp-traces.sh
      - name: Test
        run: mvn -B -ntp test
        env:
          HUGINN_ICSNPP_TRACES: ${{ github.workspace }}/samples/icsnpp
      - name: Package the shaded CLI
        run: mvn -B -ntp -DskipTests package
